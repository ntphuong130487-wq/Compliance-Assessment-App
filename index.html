<title>AgriS Compliance Assessment</title>
<style>
:root{--g:#0b7338;--g2:#139447;--green-dark:#0c4e2f;--blue:#0a4c7d;--lime:#83d41f;--bg:#f3f7f4;--card:#fff;--ink:#173027;--muted:#687a70;--line:#dce8e0;--red:#a83232;--amber:#9a5b08;--soft:#ecf6ef}
*{box-sizing:border-box}body{margin:0;font:14px Montserrat,Aptos,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 78% 4%,rgba(131,212,31,.08),transparent 26%),var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0b4f30 0%,#0c6a38 55%,#083c2b 100%);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;box-shadow:10px 0 35px rgba(4,58,34,.12)}.brand{display:flex;gap:10px;align-items:center;padding:3px 8px 22px}.brand-logo{width:112px;height:auto;display:block;filter:brightness(0) invert(1)}.brand-copy{border-left:1px solid rgba(255,255,255,.24);padding-left:10px}.brand-copy b{display:block;font-size:13px}.brand small{display:block;opacity:.72;margin-top:2px}.nav button{display:block;width:100%;border:0;background:transparent;color:#dce8e1;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:rgba(255,255,255,.13);color:#fff}.main{min-width:0}.top{height:68px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.top h1{font-size:20px;margin:0;color:var(--green-dark);letter-spacing:-.2px}.content{padding:24px;max-width:1500px}.note{padding:11px 13px;background:#fff8dd;border:1px solid #eadb8c;border-radius:10px;margin-bottom:16px;font-size:12px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 10px 30px rgba(18,82,48,.06)}.kpi{position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-18px;top:-25px;width:72px;height:72px;border-radius:50%;background:rgba(131,212,31,.09)}.kpi b{display:block;font-size:28px;margin-top:8px;color:var(--green-dark)}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.btn{border:0;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;box-shadow:0 5px 14px rgba(11,115,56,.16)}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--line);box-shadow:none}.btn.red{background:var(--red)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ef;font-size:11px;font-weight:700}.tag.red{background:#fdebea;color:var(--red)}.tag.green{background:#e7f4ea;color:#24623d}.tag.amber{background:#fff1de;color:var(--amber)}.tag.blue{background:#eaf1fa;color:var(--blue)}.table{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f7f9f8;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack{display:grid;gap:10px}.req{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.req.on{border-color:var(--g2);box-shadow:0 0 0 2px rgba(19,148,71,.10)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #ccd8d2;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:82px}.drop{border:2px dashed #c8d5ce;border-radius:10px;padding:18px;text-align:center;background:#fafcfb;cursor:pointer}.ai{border-left:4px solid var(--blue);background:#f3f7fb;padding:10px;border-radius:8px;margin:8px 0}.finding{border-left:4px solid var(--red)}.bar{height:9px;background:#e8eeeb;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}.modalbg{position:fixed;inset:0;background:rgba(15,25,20,.5);display:grid;place-items:center;padding:16px;z-index:20}.modal{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:20px}.pass{color:#22623d;font-weight:800}.fail{color:var(--red);font-weight:800}.mobile{display:none}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:14px}.top{padding:0 14px}.kpis{grid-template-columns:repeat(2,1fr)}.mobile{display:flex;overflow:auto;gap:6px;background:var(--g);padding:8px;position:sticky;top:66px;z-index:2}.mobile button{white-space:nowrap;border:0;border-radius:999px;padding:7px 9px;background:rgba(255,255,255,.12);color:#fff}.mobile button.on{background:var(--lime);color:var(--g);font-weight:800}}
.brand-hero{background:linear-gradient(120deg,rgba(11,115,56,.98),rgba(10,76,125,.94));color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 16px 38px rgba(9,82,48,.18)}.brand-hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-85px;top:-160px;background:radial-gradient(circle,rgba(131,212,31,.35),rgba(131,212,31,0))}.brand-hero h2{margin:0 0 6px;font-size:24px}.brand-hero p{margin:0;max-width:820px;opacity:.86}.source-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.source-mode{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer}.source-mode.on{border-color:var(--g2);background:linear-gradient(180deg,#f5fbf6,#edf8f0);box-shadow:0 0 0 2px rgba(19,148,71,.08)}.source-mode b{display:block;color:var(--green-dark);margin-bottom:4px}.obligation{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:13px;background:#fff}.obligation.accepted{border-left-color:var(--g2);background:#f7fcf8}.obligation.rejected{opacity:.58;border-left-color:#9aa9a0}.source-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.source-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}.mini-stat{background:#f6faf7;border:1px solid #e6eee9;border-radius:9px;padding:8px}.framework-head{display:flex;align-items:center;gap:10px}.framework-head .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(131,212,31,.12)}.search-warning{padding:10px;border-radius:10px;background:#fff8df;border:1px solid #ead58b;color:#6b5300}.source-tabs{display:flex;gap:6px;flex-wrap:wrap}.source-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.source-tabs button.on{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}@media(max-width:900px){.source-modes{grid-template-columns:1fr}.source-meta{grid-template-columns:1fr 1fr}}
</style>

<script>
(function(){
var KEY="agris_compliance_mvp01";
var tabs=[["dashboard","Điều hành"],["frameworks","Nguồn & Khung tuân thủ"],["assessments","Chương trình đánh giá"],["fieldwork","Kiểm tra hiện trường"],["findings","Phát hiện"],["actions","Khắc phục"],["reports","Báo cáo"]];
var view="dashboard",selectedAssessment=null,selectedRA=null,sourceMode="file";
function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toISOString()}
function seed(){var fw="fw_demo";var req=[["r1","REQ-DEMO-01","Phê duyệt trước khi thực hiện giao dịch"],["r2","REQ-DEMO-02","Lưu hồ sơ đầy đủ và có thể truy xuất"],["r3","REQ-DEMO-03","Thực hiện đúng phân quyền"]].map(function(x){return{id:x[0],frameworkId:fw,code:x[1],title:x[2],description:"Yêu cầu minh họa để kiểm thử sản phẩm, không phải quy định thực tế của AgriS.",assessable:true,test:"Đối chiếu hồ sơ và dữ liệu thực tế với yêu cầu.",expected:"Chứng từ, hồ sơ, log hệ thống hoặc hình ảnh phù hợp."}});
var a="as_demo";return{meta:{demo:true,version:"0.1"},org:[{id:"ho",name:"HO"},{id:"agric",name:"AgriC"},{id:"proc",name:"ProC"},{id:"comc",name:"ComC"}],frameworks:[{id:fw,code:"FW-DEMO-01",name:"Khung tuân thủ minh họa",version:"0.1",status:"draft",reqIds:req.map(function(r){return r.id})}],requirements:req,assessments:[{id:a,name:"Đánh giá minh họa – AgriC",frameworkId:fw,orgId:"agric",objective:"Kiểm thử end-to-end.",scope:"",includeAll:true,status:"fieldwork",locked:false}],ra:req.map(function(r,i){return{id:"ra"+i,assessmentId:a,requirementId:r.id,workflow:i===0?"in_progress":"to_do",result:"not_assessed",evidenceIds:[]}}),evidence:[],revisions:[],links:[],proposals:[],findings:[],actions:[],verifications:[],logs:[{id:id("log"),type:"seed_demo",object:"Assessment",at:now(),note:"Dữ liệu minh họa để kiểm thử ứng dụng."}]}}
function normalizeState(s){s=s||seed();s.responses=s.responses||[];s.sources=s.sources||[];s.draftRequirements=s.draftRequirements||[];return s}
function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY))||seed())}catch(e){return normalizeState(seed())}}
var S=load(),syncMode="local",remoteVersion=0,syncTimer=null,lastSyncAt=null;
selectedAssessment=S.assessments[0]&&S.assessments[0].id;selectedRA=S.ra[0]&&S.ra[0].id;
function persistLocal(){localStorage.setItem(KEY,JSON.stringify(S))}
async function pullRemote(){
  try{
    var res=await fetch("/api/state",{headers:{"Accept":"application/json"}});
    var data=await res.json();
    if(!data.configured){syncMode="local";render();return}
    if(data.authRequired){syncMode="secure-local";render();return}
    syncMode="cloud";
    if(data.exists&&data.state){
      S=normalizeState(data.state);remoteVersion=Number(data.version||0);lastSyncAt=data.updatedAt||null;
      persistLocal();
      selectedAssessment=S.assessments[0]&&S.assessments[0].id;
      selectedRA=S.ra[0]&&S.ra[0].id;
      render();
    }else{
      await pushRemote(true);
    }
  }catch(e){syncMode="offline";render()}
}
async function pushRemote(force){
  if(!force&&syncMode!=="cloud")return;
  try{
    var res=await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:S,version:remoteVersion})});
    var data=await res.json();
    if(res.status===409){await pullRemote();return}
    if(data.configured&&data.ok){syncMode="cloud";remoteVersion=Number(data.version||remoteVersion);lastSyncAt=data.updatedAt||now();render()}
  }catch(e){syncMode="offline"}
}
function save(){
  persistLocal();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){pushRemote(false)},450);
}
function esc(s){return String(s==null?"":s).replace(/[&<>'"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]})}
var labels={dashboard:"Điều hành",draft:"Nháp",fieldwork:"Đang kiểm tra",review:"Rà soát",closed:"Đã đóng",to_do:"Chưa làm",in_progress:"Đang làm",in_review:"Đang rà soát",done:"Hoàn tất",not_assessed:"Chưa đánh giá",compliant:"Tuân thủ",partially_compliant:"Tuân thủ một phần",non_compliant:"Không tuân thủ",not_applicable:"Không áp dụng",insufficient_evidence:"Chưa đủ bằng chứng",confirmed:"Đã xác nhận",assigned:"Đã giao",pending_verification:"Chờ xác minh",open:"Mở",verified:"Đã xác minh",overdue:"Quá hạn",reopened:"Mở lại",accepted:"Đã chấp nhận",rejected:"Đã bác bỏ"};
function lab(x){return labels[x]||x}
function tag(x){var c=["non_compliant","overdue","reopened"].indexOf(x)>=0?"red":["compliant","closed","verified","done"].indexOf(x)>=0?"green":["partially_compliant","in_review","pending_verification"].indexOf(x)>=0?"amber":"blue";return'<span class="tag '+c+'">'+esc(lab(x))+"</span>"}
function visibleAssessments(){return S.assessments.filter(function(a){return can("view_dashboard",a)})}
function visibleRA(){var ids=visibleAssessments().map(function(a){return a.id});return S.ra.filter(function(r){return ids.indexOf(r.assessmentId)>=0})}
function findingAssessment(f){var r=S.ra.find(function(x){return x.id===f.raId});return r&&S.assessments.find(function(a){return a.id===r.assessmentId})}
function visibleFindings(){return S.findings.filter(function(f){var a=findingAssessment(f);return a&&can("view_dashboard",a)})}
function visibleActions(){var fs=visibleFindings().map(function(f){return f.id});return S.actions.filter(function(a){return fs.indexOf(a.findingId)>=0})}
function metrics(){var rs=visibleRA(),fs=visibleFindings(),as=visibleActions(),done=rs.filter(function(x){return x.workflow==="done"}).length;return{active:visibleAssessments().filter(function(a){return a.status!=="closed"}).length,done:done,total:rs.length,coverage:rs.length?Math.round(done*100/rs.length):0,nc:rs.filter(function(x){return x.result==="non_compliant"}).length,find:fs.filter(function(x){return x.status!=="closed"}).length,over:as.filter(function(x){return x.status==="overdue"||(x.due&&new Date(x.due)<new Date()&&x.status!=="closed")}).length}}
function nav(){return tabs.filter(function(t){return ComplianceAccess.viewAllowed(t[0])}).map(function(t){return'<button data-nav="'+t[0]+'" class="'+(view===t[0]?"on":"")+'">'+t[1]+"</button>"}).join("")}
function syncBadge(){var t=syncMode==="cloud"?"Cloud sync":syncMode==="offline"?"Offline fallback":syncMode==="secure-local"?"Secure local":"Local";var cls=syncMode==="cloud"?"green":syncMode==="offline"||syncMode==="secure-local"?"amber":"blue";return'<span class="tag '+cls+'" title="'+esc(lastSyncAt?"Đồng bộ: "+lastSyncAt:"")+'">'+t+'</span>'}
function can(p,a){return ComplianceAccess.can(p,{assessment:a||null})}
function guard(p,a){if(can(p,a))return true;modal('<h3>Không đủ quyền</h3><p>Vai trò mô phỏng hiện tại không có quyền thực hiện thao tác này.</p><p class="small muted">Đây là kiểm thử policy; đăng nhập thật chưa được cấu hình.</p>');return false}

function sourceStatusLabel(s){
  return({draft:"Nháp",extracted:"Đã bóc tách",published:"Đã publish",search_not_configured:"Chưa kết nối nguồn search",needs_ocr:"Cần OCR/AI",error:"Lỗi"})[s]||s;
}
function localExtract(text,sourceId){
  var keys=["phải","không được","có trách nhiệm","chịu trách nhiệm","chỉ được","bắt buộc","thực hiện","bảo đảm","đảm bảo","lưu giữ","lưu trữ","báo cáo","phê duyệt","tuân thủ","cấm","đăng ký","thông báo"];
  var parts=String(text||"").replace(/\r/g,"\n").split(/\n+|(?<=[.;!?])\s+/).map(function(x){return x.trim()}).filter(Boolean);
  var cand=parts.filter(function(s){var x=s.toLowerCase();return s.length>=18&&keys.some(function(k){return x.indexOf(k)>=0})});
  if(!cand.length)cand=parts.filter(function(s){return s.length>=40}).slice(0,30);
  return cand.slice(0,60).map(function(s){
    var x=s.toLowerCase(),type=/không được|cấm/.test(x)?"prohibition":/phê duyệt|chấp thuận/.test(x)?"approval":/lưu giữ|lưu trữ|hồ sơ|chứng từ/.test(x)?"record":/báo cáo|thông báo/.test(x)?"reporting":/đăng ký|giấy phép|điều kiện/.test(x)?"condition":/trách nhiệm/.test(x)?"responsibility":"general";
    return{id:id("dr"),sourceId:sourceId,sourceClause:"",originalText:s,obligation:s,applicability:"",obligationType:type,mandatoryLevel:/nếu|trường hợp|khi /.test(x)?"conditional":/phải|không được|cấm|bắt buộc|chỉ được/.test(x)?"mandatory":"review",expectedEvidence:"Hồ sơ, dữ liệu hệ thống, chứng từ hoặc bằng chứng thực tế phù hợp.",testProcedure:"Đối chiếu bằng chứng thực tế với yêu cầu và phạm vi áp dụng của nghĩa vụ.",reviewStatus:"draft"};
  });
}
async function extractTextSource(src,text){
  var drafts=[];
  try{
    var res=await fetch("/api/obligations/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text,sourceId:src.id})});
    var data=await res.json();
    if(res.ok&&data.ok)drafts=(data.obligations||[]).map(function(d){d.id=id("dr");return d});
  }catch(e){}
  if(!drafts.length)drafts=localExtract(text,src.id);
  S.draftRequirements=S.draftRequirements.concat(drafts);
  src.status="extracted";src.extractedCount=drafts.length;src.updatedAt=now();save();render();
}

  if(!guard("manage_framework"))return;
  modal('<h3>Nhập nội dung quy định</h3><form id="srcTextForm"><div class="field"><label>Tên nguồn</label><input name="title" required placeholder="Ví dụ: Quy chế/Quy trình/Văn bản..."></div><div class="field"><label>Loại nguồn</label><select name="sourceType"><option>Quy định nội bộ</option><option>Quy trình</option><option>Quy định nhà nước</option><option>Tiêu chuẩn</option><option>Hợp đồng/Cam kết</option></select></div><div class="field"><label>Nội dung</label><textarea name="text" required style="min-height:220px" placeholder="Dán nội dung cần bóc tách nghĩa vụ..."></textarea></div><button class="btn">Bóc tách nghĩa vụ</button></form>');
  document.getElementById("srcTextForm").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target)),src={id:id("src"),title:d.title,sourceType:d.sourceType,inputMode:"text",status:"draft",createdAt:now(),excerpt:d.text.slice(0,1000)};S.sources.unshift(src);document.getElementById("mb").remove();extractTextSource(src,d.text)}
}
function addFileSource(){
  if(!guard("manage_framework"))return;
  var p=document.getElementById("sourceFile");p.value="";
  p.onchange=async function(){var file=p.files&&p.files[0];if(!file)return;var src={id:id("src"),title:file.name,sourceType:"Tệp đính kèm",inputMode:"file",fileName:file.name,fileType:file.type,status:"draft",createdAt:now()};S.sources.unshift(src);save();render();
    try{
      var res=await fetch("/api/source/extract",{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream","X-File-Name":encodeURIComponent(file.name),"X-Source-Id":src.id},body:file});
      var data=await res.json();
      if(res.ok&&data.ok){var ds=(data.obligations||[]).map(function(d){d.id=id("dr");return d});S.draftRequirements=S.draftRequirements.concat(ds);src.status="extracted";src.extractedCount=ds.length;src.excerpt=(data.text||"").slice(0,1000)}
      else{src.status=data.ocrRequired?"needs_ocr":"error";src.error=data.error||"Không đọc được tệp";}
    }catch(e){src.status="error";src.error="Không kết nối được bộ đọc tài liệu";}
    src.updatedAt=now();save();render();
  };p.click();
}

function publishDrafts(){
  if(!guard("manage_framework"))return;
  var fwId=document.getElementById("publishFw")&&document.getElementById("publishFw").value,fw=S.frameworks.find(function(x){return x.id===fwId}),ds=S.draftRequirements.filter(function(d){return d.reviewStatus==="accepted"});
  if(!fw||!ds.length){modal('<h3>Chưa thể publish</h3><p>Cần có ít nhất một nghĩa vụ đã <b>Chấp nhận</b> và chọn Khung đích.</p>');return}
  ds.forEach(function(d,i){var req={id:id("r"),frameworkId:fw.id,code:"AUTO-"+String(Date.now()).slice(-6)+"-"+String(i+1).padStart(2,"0"),title:d.obligation,description:d.originalText||"",assessable:true,test:d.testProcedure||"Cần xác định",expected:d.expectedEvidence||"Cần xác định",sourceId:d.sourceId,sourceClause:d.sourceClause||"",applicability:d.applicability||"",obligationType:d.obligationType||"general",mandatoryLevel:d.mandatoryLevel||"review"};S.requirements.push(req);fw.reqIds.push(req.id);d.reviewStatus="published"});
  S.sources.forEach(function(s){var own=S.draftRequirements.filter(function(d){return d.sourceId===s.id});if(own.length&&own.every(function(d){return d.reviewStatus==="published"||d.reviewStatus==="rejected"}))s.status="published"});
  save();render();
}

async function storeEvidenceFile(f){
  try{
    var cfg=await fetch("/api/evidence",{headers:{"Accept":"application/json"}}).then(function(r){return r.json()});
    if(!cfg.configured||!cfg.authConfigured)return{storage:"local-metadata"};
    var res=await fetch("/api/evidence",{method:"POST",headers:{"Content-Type":f.type||"application/octet-stream","X-File-Name":encodeURIComponent(f.name)},body:f});
    var data=await res.json();
    if(res.ok&&data.ok)return{storage:"blob-private",fileUri:data.url,downloadUrl:data.downloadUrl||null};
  }catch(e){}
  return{storage:"local-metadata"};
}

  document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target));S.responses.push({id:id("resp"),findingId:fid,type:d.type,text:d.text,at:now(),persona:ComplianceAccess.current().role});S.logs.push({id:id("log"),type:"unit_response",object:"Finding",at:now(),note:d.type});save();document.getElementById("mb").remove();render()}
}
function action(fid){modal('<h3>Giao hành động khắc phục</h3><form id="f"><div class="field"><label>Hành động</label><textarea name="text" required></textarea></div><div class="field"><label>Owner</label><input name="owner" required></div><div class="field"><label>Hạn</label><input type="date" name="due"></div><button class="btn">Giao hành động</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target));d.id=id("act");d.findingId=fid;d.status="open";S.actions.push(d);save();document.getElementById("mb").remove();view="actions";render()}}
function verify(aid){modal('<h3>Xác minh hành động</h3><form id="f"><div class="field"><label>Kết quả</label><select name="result"><option value="effective">Đạt/hiệu lực</option><option value="ineffective">Chưa đạt</option></select></div><div class="field"><label>Ghi chú</label><textarea name="note"></textarea></div><button class="btn">Ghi nhận</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target)),a=S.actions.find(function(x){return x.id===aid});S.verifications.push({id:id("v"),actionId:aid,result:d.result,note:d.note,at:now()});a.status=d.result==="effective"?"closed":"reopened";var f=S.findings.find(function(x){return x.id===a.findingId}),all=S.actions.filter(function(x){return x.findingId===a.findingId});if(f&&all.length&&all.every(function(x){return x.status==="closed"}))f.status="closed";save();document.getElementById("mb").remove();render()}}
function bind(){
  document.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){if(ComplianceAccess.viewAllowed(b.dataset.nav)){view=b.dataset.nav;render()}}});
  document.querySelectorAll("[data-source-mode]").forEach(function(b){b.onclick=function(){sourceMode=b.dataset.sourceMode;render()}});
  document.querySelectorAll("[data-draft-accept]").forEach(function(b){b.onclick=function(){var d=S.draftRequirements.find(function(x){return x.id===b.dataset.draftAccept});if(d){d.reviewStatus="accepted";save();render()}}});
  document.querySelectorAll("[data-draft-reject]").forEach(function(b){b.onclick=function(){var d=S.draftRequirements.find(function(x){return x.id===b.dataset.draftReject});if(d){d.reviewStatus="rejected";save();render()}}});
  document.querySelectorAll("[data-draft-edit]").forEach(function(b){b.onclick=function(){editDraft(b.dataset.draftEdit)}});

  document.querySelectorAll("[data-act]").forEach(function(b){b.onclick=function(){
    var x=b.dataset.act,a=S.assessments.find(function(z){return z.id===selectedAssessment});
    if(x==="qa")qa();
    if(x==="reset"&&confirm("Khôi phục dữ liệu minh họa ban đầu?")){S=seed();save();selectedAssessment=S.assessments[0].id;selectedRA=S.ra[0].id;render()}
    if(x==="close")document.getElementById("mb").remove();
    if(x==="newfw"&&guard("manage_framework"))newfw();
    if(x==="sourceFile")addFileSource();
    if(x==="sourceText")addTextSource();
    if(x==="sourceSearch")searchRegulations();
    if(x==="publishDrafts")publishDrafts();
    if(x==="newas"&&guard("manage_assessment"))newas();
    if(x==="upload")upload();
    if(x==="analyze"&&guard("review_ai",a))analyze();
    if(x==="finding"&&guard("confirm_finding",a))finding();
    if(x==="compliant"&&guard("confirm_finding",a)){var r=S.ra.find(function(y){return y.id===selectedRA});r.result="compliant";r.workflow="done";save();render()}
  }});
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){var a=S.assessments.find(function(x){return x.id===b.dataset.open});if(can("view_dashboard",a)){selectedAssessment=b.dataset.open;selectedRA=null;view="fieldwork";render()}}});
  document.querySelectorAll("[data-ra]").forEach(function(b){b.onclick=function(){selectedRA=b.dataset.ra;render()}});
  document.querySelectorAll("[data-accept]").forEach(function(b){b.onclick=function(){var a=S.assessments.find(function(x){return x.id===selectedAssessment});if(!guard("review_ai",a))return;var p=S.proposals.find(function(x){return x.id===b.dataset.accept}),r=S.ra.find(function(x){return x.id===p.raId});p.status="accepted";r.result=p.result;r.workflow="in_review";save();render()}});
  document.querySelectorAll("[data-reject]").forEach(function(b){b.onclick=function(){var a=S.assessments.find(function(x){return x.id===selectedAssessment});if(!guard("review_ai",a))return;S.proposals.find(function(x){return x.id===b.dataset.reject}).status="rejected";save();render()}});
  document.querySelectorAll("[data-respond]").forEach(function(b){b.onclick=function(){respond(b.dataset.respond)}});
  document.querySelectorAll("[data-actionfor]").forEach(function(b){b.onclick=function(){var f=S.findings.find(function(x){return x.id===b.dataset.actionfor}),a=f&&findingAssessment(f);if(guard("assign_action",a))action(b.dataset.actionfor)}});
  document.querySelectorAll("[data-verify]").forEach(function(b){b.onclick=function(){if(guard("verify_action"))verify(b.dataset.verify)}});
  var s=document.getElementById("asSel");if(s)s.onchange=function(){selectedAssessment=s.value;selectedRA=null;render()};
  var ps=document.getElementById("personaSel");if(ps)ps.onchange=function(){ComplianceAccess.setPersona(ps.value);if(!ComplianceAccess.viewAllowed(view))view="dashboard";render()};
}
function render(){if(!ComplianceAccess.viewAllowed(view))view="dashboard";var f={dashboard:dashboard,frameworks:frameworks,assessments:assessments,fieldwork:fieldwork,findings:findings,actions:actions,reports:reports}[view]||dashboard;document.getElementById("root").innerHTML=f();bind()}
render();
pullRemote();
})();
</script>
</body></html>
