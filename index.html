<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriS Compliance Assessment</title>
<style>
:root{--g:#173f2e;--g2:#2f6a4d;--lime:#b8d83d;--bg:#f4f7f5;--card:#fff;--ink:#1c2822;--muted:#6d7972;--line:#dfe7e2;--red:#a83232;--amber:#9a5b08;--blue:#2b5f91}
*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--g);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}.logo{width:38px;height:38px;border-radius:10px;background:var(--lime);color:var(--g);font-weight:900;display:grid;place-items:center}.brand small{display:block;opacity:.7}.nav button{display:block;width:100%;border:0;background:transparent;color:#dce8e1;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:rgba(255,255,255,.13);color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.top h1{font-size:20px;margin:0}.content{padding:24px;max-width:1500px}.note{padding:11px 13px;background:#fff8dd;border:1px solid #eadb8c;border-radius:10px;margin-bottom:16px;font-size:12px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 8px 24px rgba(20,55,40,.06)}.kpi b{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.btn{border:0;background:var(--g);color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:650}.btn.alt{background:#fff;color:var(--g);border:1px solid var(--line)}.btn.red{background:var(--red)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ef;font-size:11px;font-weight:700}.tag.red{background:#fdebea;color:var(--red)}.tag.green{background:#e7f4ea;color:#24623d}.tag.amber{background:#fff1de;color:var(--amber)}.tag.blue{background:#eaf1fa;color:var(--blue)}.table{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f7f9f8;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack{display:grid;gap:10px}.req{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.req.on{border-color:var(--g2);box-shadow:0 0 0 2px rgba(47,106,77,.1)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #ccd8d2;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:82px}.drop{border:2px dashed #c8d5ce;border-radius:10px;padding:18px;text-align:center;background:#fafcfb;cursor:pointer}.ai{border-left:4px solid var(--blue);background:#f3f7fb;padding:10px;border-radius:8px;margin:8px 0}.finding{border-left:4px solid var(--red)}.bar{height:9px;background:#e8eeeb;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}.modalbg{position:fixed;inset:0;background:rgba(15,25,20,.5);display:grid;place-items:center;padding:16px;z-index:20}.modal{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:20px}.pass{color:#22623d;font-weight:800}.fail{color:var(--red);font-weight:800}.mobile{display:none}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:14px}.top{padding:0 14px}.kpis{grid-template-columns:repeat(2,1fr)}.mobile{display:flex;overflow:auto;gap:6px;background:var(--g);padding:8px;position:sticky;top:66px;z-index:2}.mobile button{white-space:nowrap;border:0;border-radius:999px;padding:7px 9px;background:rgba(255,255,255,.12);color:#fff}.mobile button.on{background:var(--lime);color:var(--g);font-weight:800}}
</style>
</head>
<body><div id="root"></div><input id="files" type="file" multiple hidden>
<script>
(function(){
var KEY="agris_compliance_mvp01";
var tabs=[["dashboard","Điều hành"],["frameworks","Khung tuân thủ"],["assessments","Chương trình đánh giá"],["fieldwork","Kiểm tra hiện trường"],["findings","Phát hiện"],["actions","Khắc phục"],["reports","Báo cáo"]];
var view="dashboard",selectedAssessment=null,selectedRA=null;
function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toISOString()}
function seed(){var fw="fw_demo";var req=[["r1","REQ-DEMO-01","Phê duyệt trước khi thực hiện giao dịch"],["r2","REQ-DEMO-02","Lưu hồ sơ đầy đủ và có thể truy xuất"],["r3","REQ-DEMO-03","Thực hiện đúng phân quyền"]].map(function(x){return{id:x[0],frameworkId:fw,code:x[1],title:x[2],description:"Yêu cầu minh họa để kiểm thử sản phẩm, không phải quy định thực tế của AgriS.",assessable:true,test:"Đối chiếu hồ sơ và dữ liệu thực tế với yêu cầu.",expected:"Chứng từ, hồ sơ, log hệ thống hoặc hình ảnh phù hợp."}});
var a="as_demo";return{meta:{demo:true,version:"0.1"},org:[{id:"ho",name:"HO"},{id:"agric",name:"AgriC"},{id:"proc",name:"ProC"},{id:"comc",name:"ComC"}],frameworks:[{id:fw,code:"FW-DEMO-01",name:"Khung tuân thủ minh họa",version:"0.1",status:"draft",reqIds:req.map(function(r){return r.id})}],requirements:req,assessments:[{id:a,name:"Đánh giá minh họa – AgriC",frameworkId:fw,orgId:"agric",objective:"Kiểm thử end-to-end.",scope:"",includeAll:true,status:"fieldwork",locked:false}],ra:req.map(function(r,i){return{id:"ra"+i,assessmentId:a,requirementId:r.id,workflow:i===0?"in_progress":"to_do",result:"not_assessed",evidenceIds:[]}}),evidence:[],revisions:[],links:[],proposals:[],findings:[],actions:[],verifications:[],logs:[{id:id("log"),type:"seed_demo",object:"Assessment",at:now(),note:"Dữ liệu minh họa để kiểm thử ứng dụng."}]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}
var S=load();selectedAssessment=S.assessments[0]&&S.assessments[0].id;selectedRA=S.ra[0]&&S.ra[0].id;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return String(s==null?"":s).replace(/[&<>'"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]})}
var labels={dashboard:"Điều hành",draft:"Nháp",fieldwork:"Đang kiểm tra",review:"Rà soát",closed:"Đã đóng",to_do:"Chưa làm",in_progress:"Đang làm",in_review:"Đang rà soát",done:"Hoàn tất",not_assessed:"Chưa đánh giá",compliant:"Tuân thủ",partially_compliant:"Tuân thủ một phần",non_compliant:"Không tuân thủ",not_applicable:"Không áp dụng",insufficient_evidence:"Chưa đủ bằng chứng",confirmed:"Đã xác nhận",assigned:"Đã giao",pending_verification:"Chờ xác minh",open:"Mở",verified:"Đã xác minh",overdue:"Quá hạn",reopened:"Mở lại",accepted:"Đã chấp nhận",rejected:"Đã bác bỏ"};
function lab(x){return labels[x]||x}
function tag(x){var c=["non_compliant","overdue","reopened"].indexOf(x)>=0?"red":["compliant","closed","verified","done"].indexOf(x)>=0?"green":["partially_compliant","in_review","pending_verification"].indexOf(x)>=0?"amber":"blue";return'<span class="tag '+c+'">'+esc(lab(x))+"</span>"}
function metrics(){var total=S.ra.length,done=S.ra.filter(function(x){return x.workflow==="done"}).length;return{active:S.assessments.filter(function(a){return a.status!=="closed"}).length,done:done,total:total,coverage:total?Math.round(done*100/total):0,nc:S.ra.filter(function(x){return x.result==="non_compliant"}).length,find:S.findings.filter(function(x){return x.status!=="closed"}).length,over:S.actions.filter(function(x){return x.status==="overdue"||(x.due&&new Date(x.due)<new Date()&&x.status!=="closed")}).length}}
function nav(){return tabs.map(function(t){return'<button data-nav="'+t[0]+'" class="'+(view===t[0]?"on":"")+'">'+t[1]+"</button>"}).join("")}
function shell(title,body){return'<div class="app"><aside class="side"><div class="brand"><div class="logo">A</div><div><b>AgriS Compliance</b><small>Assessment App · MVP v0.1</small></div></div><div class="nav">'+nav()+'</div></aside><main class="main"><header class="top"><h1>'+esc(title)+'</h1><div class="row"><button class="btn alt" data-act="qa">QA Check</button><button class="btn alt" data-act="reset">Reset demo</button></div></header><div class="mobile">'+nav()+'</div><div class="content"><div class="note"><b>Lưu ý:</b> dữ liệu mặc định là dữ liệu minh họa để kiểm thử, không phải số liệu tuân thủ thực tế của AgriS. MVP hiện lưu dữ liệu trên trình duyệt.</div>'+body+"</div></main></div>"}
function dashboard(){var m=metrics();return shell("Điểm chính cần nắm",'<div class="grid kpis"><div class="card kpi"><span class="muted small">Assessment đang mở</span><b>'+m.active+'</b></div><div class="card kpi"><span class="muted small">Điểm hoàn tất</span><b>'+m.done+"/"+m.total+'</b></div><div class="card kpi"><span class="muted small">Coverage</span><b>'+m.coverage+'%</b></div><div class="card kpi"><span class="muted small">Không tuân thủ</span><b>'+m.nc+'</b></div><div class="card kpi"><span class="muted small">Finding mở</span><b>'+m.find+'</b></div><div class="card kpi"><span class="muted small">Action quá hạn</span><b>'+m.over+'</b></div></div><div class="split" style="margin-top:14px"><div class="card"><h3>Tiến độ assessment</h3>'+S.assessments.map(function(a){var rows=S.ra.filter(function(r){return r.assessmentId===a.id}),d=rows.filter(function(r){return r.workflow==="done"}).length,p=rows.length?Math.round(d*100/rows.length):0;return'<div style="margin:12px 0"><div class="row"><b>'+esc(a.name)+'</b><span class="right">'+tag(a.status)+'</span></div><div class="small muted">'+d+"/"+rows.length+' điểm hoàn tất</div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")+'</div><div class="card"><h3>Nguyên tắc vận hành</h3><ul class="small"><li>AI chỉ đề xuất; người kiểm tra xác nhận kết luận.</li><li>Tiến độ đánh giá tách khỏi kết quả tuân thủ.</li><li>Evidence quản lý theo revision; không ghi đè lịch sử.</li><li>Finding → Action → Verification → Close.</li></ul></div></div>')}
function frameworks(){return shell("Khung tuân thủ",'<div class="row"><div><h2>Khung tuân thủ</h2><span class="small muted">Nguồn → requirement → thủ tục kiểm tra → bằng chứng kỳ vọng.</span></div><button class="btn right" data-act="newfw">+ Tạo khung</button></div>'+S.frameworks.map(function(f){var rr=S.requirements.filter(function(r){return f.reqIds.indexOf(r.id)>=0});return'<div class="card" style="margin-top:12px"><div class="row"><b>'+esc(f.code)+" · "+esc(f.name)+'</b><span class="right">'+tag(f.status)+'</span></div><div class="table" style="margin-top:10px"><table><thead><tr><th>Mã</th><th>Điểm phải tuân thủ</th><th>Thủ tục</th><th>Bằng chứng kỳ vọng</th></tr></thead><tbody>'+rr.map(function(r){return"<tr><td>"+esc(r.code)+"</td><td><b>"+esc(r.title)+'</b><div class="small muted">'+esc(r.description)+"</div></td><td>"+esc(r.test)+"</td><td>"+esc(r.expected)+"</td></tr>"}).join("")+"</tbody></table></div></div>"}).join(""))}
function assessments(){return shell("Chương trình đánh giá",'<div class="row"><div><h2>Assessment</h2><span class="small muted">Để trống phạm vi requirement = kiểm toàn bộ điểm assessable trong khung.</span></div><button class="btn right" data-act="newas">+ Tạo assessment</button></div><div class="table" style="margin-top:12px"><table><thead><tr><th>Tên</th><th>Đơn vị</th><th>Khung</th><th>Phạm vi</th><th>Tiến độ</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+S.assessments.map(function(a){var u=S.org.find(function(x){return x.id===a.orgId}),f=S.frameworks.find(function(x){return x.id===a.frameworkId}),rows=S.ra.filter(function(x){return x.assessmentId===a.id}),d=rows.filter(function(x){return x.workflow==="done"}).length;return'<tr><td><b>'+esc(a.name)+'</b><div class="small muted">'+esc(a.objective)+'</div></td><td>'+esc(u&&u.name)+'</td><td>'+esc(f&&f.name)+'</td><td>'+(a.includeAll?"Toàn bộ requirement":esc(a.scope))+'</td><td>'+d+"/"+rows.length+"</td><td>"+tag(a.status)+'</td><td><button class="btn" data-open="'+a.id+'">Kiểm tra</button></td></tr>'}).join("")+"</tbody></table></div>")}
function fieldwork(){var a=S.assessments.find(function(x){return x.id===selectedAssessment})||S.assessments[0];if(!a)return shell("Kiểm tra hiện trường",'<div class="card">Chưa có assessment.</div>');selectedAssessment=a.id;var rows=S.ra.filter(function(x){return x.assessmentId===a.id});if(!rows.some(function(x){return x.id===selectedRA}))selectedRA=rows[0]&&rows[0].id;var ra=rows.find(function(x){return x.id===selectedRA}),rq=ra&&S.requirements.find(function(x){return x.id===ra.requirementId}),links=ra?S.links.filter(function(l){return l.targetId===ra.id}):[],props=ra?S.proposals.filter(function(p){return p.raId===ra.id}).slice().reverse():[];var left=rows.map(function(r){var q=S.requirements.find(function(x){return x.id===r.requirementId});return'<div class="req '+(r.id===selectedRA?"on":"")+'" data-ra="'+r.id+'"><div class="row"><div><b>'+esc(q.code)+" · "+esc(q.title)+'</b><div class="small muted">'+esc(q.expected)+'</div></div><span class="right">'+tag(r.result)+" "+tag(r.workflow)+"</span></div></div>"}).join("");var right=ra?'<div class="card"><h2>'+esc(rq.code)+" · "+esc(rq.title)+'</h2><p>'+esc(rq.description)+'</p><div class="small"><b>Thủ tục:</b> '+esc(rq.test)+'</div><div class="drop" data-act="upload" style="margin-top:12px"><b>+ Chụp/Upload bằng chứng</b><div class="small muted">Ảnh, PDF, chứng từ, screenshot…</div></div><div class="field"><label>Ghi nhận người kiểm tra</label><textarea id="obs" placeholder="Ví dụ: hồ sơ thiếu phê duyệt..."></textarea></div><button class="btn alt" data-act="analyze">Phân tích / đề xuất</button><h3>Bằng chứng</h3>'+(links.length?links.map(function(l){var rv=S.revisions.find(function(x){return x.id===l.revId}),ev=rv&&S.evidence.find(function(x){return x.id===rv.evidenceId});return'<div class="row small" style="padding:7px 0;border-bottom:1px solid var(--line)"><b>'+esc(ev&&ev.name)+'</b><span class="muted">v'+esc(rv&&rv.version)+'</span></div>'}).join(""):'<div class="small muted">Chưa có bằng chứng.</div>')+'<h3>AI proposal</h3>'+(props.length?props.map(function(p){return'<div class="ai"><b>'+esc(lab(p.result))+'</b><p class="small">'+esc(p.text)+'</p><div class="small muted">MVP đang dùng rule-based screening để kiểm thử human-in-the-loop.</div>'+(p.status==="proposed"?'<div class="row"><button class="btn" data-accept="'+p.id+'">Chấp nhận</button><button class="btn alt" data-reject="'+p.id+'">Bác bỏ</button></div>':tag(p.status))+"</div>"}).join(""):'<div class="small muted">Chưa có đề xuất.</div>')+'<div class="row" style="margin-top:12px"><button class="btn red" data-act="finding">Xác nhận Finding</button><button class="btn alt" data-act="compliant">Đánh dấu tuân thủ</button></div></div>':"";return shell("Kiểm tra hiện trường",'<div class="row" style="margin-bottom:12px"><select id="asSel">'+S.assessments.map(function(x){return'<option value="'+x.id+'" '+(x.id===a.id?"selected":"")+'>'+esc(x.name)+"</option>"}).join("")+"</select>"+tag(a.status)+'</div><div class="split"><div class="stack">'+left+"</div>"+right+"</div>")}
function findings(){return shell("Phát hiện tuân thủ",S.findings.length?S.findings.map(function(f){var ra=S.ra.find(function(x){return x.id===f.raId}),q=ra&&S.requirements.find(function(x){return x.id===ra.requirementId});return'<div class="card finding" style="margin-bottom:12px"><div class="row"><div><b>'+esc(f.title)+'</b><div class="small muted">'+esc(q&&q.code)+" · "+esc(q&&q.title)+'</div></div><span class="right">'+tag(f.status)+' <span class="tag red">'+esc(f.severity)+'</span></span></div><div class="split" style="margin-top:10px"><div><b class="small">Dữ kiện</b><div>'+esc(f.fact)+'</div></div><div><b class="small">Tiêu chí</b><div>'+esc(f.criteria)+'</div></div><div><b class="small">Khoảng cách</b><div>'+esc(f.gap)+'</div></div><div><b class="small">Rủi ro/Tác động</b><div>'+esc(f.impact||"—")+'</div></div></div><div class="row" style="margin-top:10px"><span class="small"><b>Khuyến nghị:</b> '+esc(f.rec||"—")+'</span><button class="btn right" data-actionfor="'+f.id+'">+ Giao hành động</button></div></div>"}).join(""):'<div class="card">Chưa có finding chính thức.</div>')}
function actions(){return shell("Theo dõi khắc phục",S.actions.length?'<div class="table"><table><thead><tr><th>Hành động</th><th>Owner</th><th>Hạn</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+S.actions.map(function(a){return"<tr><td>"+esc(a.text)+"</td><td>"+esc(a.owner)+"</td><td>"+esc(a.due||"—")+"</td><td>"+tag(a.status)+'</td><td>'+(a.status!=="closed"?'<button class="btn" data-verify="'+a.id+'">Xác minh</button>':"")+"</td></tr>"}).join("")+"</tbody></table></div>":'<div class="card">Chưa có hành động khắc phục.</div>')}
function reports(){var m=metrics();var vals=["not_assessed","compliant","partially_compliant","non_compliant","not_applicable","insufficient_evidence"].map(function(k){return{k:k,n:S.ra.filter(function(x){return x.result===k}).length}}),mx=Math.max.apply(null,[1].concat(vals.map(function(x){return x.n})));return shell("Báo cáo & giám sát",'<div class="split"><div class="card"><h2>Coverage</h2><div style="font-size:42px;font-weight:900">'+m.coverage+'%</div><div class="bar"><i style="width:'+m.coverage+'%"></i></div><p class="small muted">Coverage phản ánh mức đã hoàn tất đánh giá, không phải mức tuân thủ.</p></div><div class="card"><h2>Phân bố kết quả</h2>'+vals.map(function(x){return'<div class="row small" style="margin:9px 0"><span style="width:135px">'+esc(lab(x.k))+'</span><div class="bar" style="flex:1"><i style="width:'+(x.n/mx*100)+'%"></i></div><b>'+x.n+"</b></div>"}).join("")+'</div></div><div class="card" style="margin-top:14px"><h2>Decision log</h2>'+S.logs.slice().reverse().map(function(x){return'<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.type)+"</b> · "+esc(x.object)+'<div class="muted">'+new Date(x.at).toLocaleString("vi-VN")+" · "+esc(x.note||"")+"</div></div>"}).join("")+"</div>")}
function modal(body){document.body.insertAdjacentHTML("beforeend",'<div class="modalbg" id="mb"><div class="modal">'+body+'<div class="row" style="margin-top:14px"><button class="btn alt right" data-act="close">Đóng</button></div></div></div>');bind()}
function qa(){var e=[];S.ra.forEach(function(r){if(!S.assessments.some(function(a){return a.id===r.assessmentId}))e.push("RequirementAssessment thiếu Assessment");if(!S.requirements.some(function(q){return q.id===r.requirementId}))e.push("RequirementAssessment thiếu Requirement")});S.revisions.forEach(function(r){if(!S.evidence.some(function(e){return e.id===r.evidenceId}))e.push("EvidenceRevision thiếu Evidence")});S.findings.forEach(function(f){if(!S.ra.some(function(r){return r.id===f.raId}))e.push("Finding thiếu RequirementAssessment")});modal("<h3>QA Check</h3>"+(e.length?'<div class="fail">FAIL · '+e.length+" lỗi</div><ul>"+e.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul>":'<div class="pass">PASS · Không phát hiện lỗi toàn vẹn dữ liệu lõi.</div><p class="small muted">Đã kiểm tra liên kết Assessment–Requirement, Evidence–Revision và Finding–RequirementAssessment.</p>'))}
function newfw(){modal('<h3>Tạo khung tuân thủ</h3><form id="f"><div class="field"><label>Tên khung</label><input name="name" required></div><div class="field"><label>Mã</label><input name="code"></div><div class="field"><label>Các điểm phải tuân thủ</label><textarea name="req" placeholder="Mỗi dòng là một yêu cầu" required></textarea></div><button class="btn">Tạo khung</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target)),fid=id("fw"),rr=d.req.split("\n").map(function(x){return x.trim()}).filter(Boolean).map(function(t,i){return{id:id("r"),frameworkId:fid,code:(d.code||"FW")+"-"+String(i+1).padStart(2,"0"),title:t,description:"",assessable:true,test:"Cần xác định",expected:"Cần xác định"}});S.requirements=S.requirements.concat(rr);S.frameworks.push({id:fid,code:d.code||fid,name:d.name,version:"0.1",status:"draft",reqIds:rr.map(function(x){return x.id})});save();document.getElementById("mb").remove();render()}}
function newas(){modal('<h3>Tạo assessment</h3><form id="f"><div class="field"><label>Tên</label><input name="name" required></div><div class="field"><label>Khung</label><select name="fw">'+S.frameworks.map(function(f){return'<option value="'+f.id+'">'+esc(f.name)+"</option>"}).join("")+'</select></div><div class="field"><label>Đơn vị</label><select name="org">'+S.org.map(function(u){return'<option value="'+u.id+'">'+esc(u.name)+"</option>"}).join("")+'</select></div><div class="field"><label>Mục tiêu</label><textarea name="objective"></textarea></div><div class="field"><label>Phạm vi requirement</label><textarea name="scope" placeholder="Để trống = toàn bộ requirement assessable"></textarea></div><button class="btn">Tạo assessment</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target)),fw=S.frameworks.find(function(x){return x.id===d.fw}),aid=id("as"),a={id:aid,name:d.name,frameworkId:d.fw,orgId:d.org,objective:d.objective,scope:d.scope,includeAll:!d.scope.trim(),status:"draft",locked:false};S.assessments.push(a);fw.reqIds.forEach(function(rid){var q=S.requirements.find(function(x){return x.id===rid});if(q&&q.assessable)S.ra.push({id:id("ra"),assessmentId:aid,requirementId:rid,workflow:"to_do",result:"not_assessed",evidenceIds:[]})});S.logs.push({id:id("log"),type:"create_assessment",object:"Assessment",at:now(),note:d.name});save();document.getElementById("mb").remove();selectedAssessment=aid;selectedRA=null;view="fieldwork";render()}}
function upload(){var p=document.getElementById("files");p.value="";p.onchange=function(){Array.from(p.files).forEach(function(f){var ev={id:id("ev"),name:f.name,type:f.type||"file"},rv={id:id("rv"),evidenceId:ev.id,version:1,size:f.size,mime:f.type,capturedAt:now()},ln={id:id("ln"),revId:rv.id,targetId:selectedRA,targetType:"RequirementAssessment"};S.evidence.push(ev);S.revisions.push(rv);S.links.push(ln);var ra=S.ra.find(function(x){return x.id===selectedRA});if(ra)ra.evidenceIds.push(ev.id)});save();render()};p.click()}
function analyze(){var ra=S.ra.find(function(x){return x.id===selectedRA}),q=ra&&S.requirements.find(function(x){return x.id===ra.requirementId}),txt=(document.getElementById("obs").value||"").toLowerCase(),neg=["không","thiếu","chưa","sai","quá hạn"].some(function(k){return txt.indexOf(k)>=0}),p={id:id("p"),raId:selectedRA,assessmentId:selectedAssessment,requirementId:q.id,result:neg?"non_compliant":"insufficient_evidence",text:neg?"Có dấu hiệu không tuân thủ liên quan "+q.code+". Cần người kiểm tra xác nhận.":"Chưa đủ căn cứ để kết luận; cần bổ sung hoặc đối chiếu bằng chứng.",status:"proposed",at:now()};S.proposals.push(p);save();render()}
function finding(){var ra=S.ra.find(function(x){return x.id===selectedRA}),q=ra&&S.requirements.find(function(x){return x.id===ra.requirementId});modal('<h3>Xác nhận Finding</h3><form id="f"><div class="field"><label>Tiêu đề</label><input name="title" value="Không tuân thủ '+esc(q.code)+'" required></div><div class="field"><label>Dữ kiện</label><textarea name="fact" required></textarea></div><div class="field"><label>Tiêu chí</label><textarea name="criteria" required>'+esc(q.title)+'</textarea></div><div class="field"><label>Khoảng cách/vi phạm</label><textarea name="gap" required></textarea></div><div class="field"><label>Rủi ro/Tác động</label><textarea name="impact"></textarea></div><div class="field"><label>Khuyến nghị</label><textarea name="rec"></textarea></div><div class="field"><label>Mức độ</label><select name="severity"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></div><button class="btn red">Xác nhận Finding</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target));d.id=id("fd");d.raId=selectedRA;d.status="confirmed";S.findings.push(d);ra.result="non_compliant";ra.workflow="done";S.logs.push({id:id("log"),type:"confirm_finding",object:"Finding",at:now(),note:d.title});save();document.getElementById("mb").remove();view="findings";render()}}
function action(fid){modal('<h3>Giao hành động khắc phục</h3><form id="f"><div class="field"><label>Hành động</label><textarea name="text" required></textarea></div><div class="field"><label>Owner</label><input name="owner" required></div><div class="field"><label>Hạn</label><input type="date" name="due"></div><button class="btn">Giao hành động</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target));d.id=id("act");d.findingId=fid;d.status="open";S.actions.push(d);save();document.getElementById("mb").remove();view="actions";render()}}
function verify(aid){modal('<h3>Xác minh hành động</h3><form id="f"><div class="field"><label>Kết quả</label><select name="result"><option value="effective">Đạt/hiệu lực</option><option value="ineffective">Chưa đạt</option></select></div><div class="field"><label>Ghi chú</label><textarea name="note"></textarea></div><button class="btn">Ghi nhận</button></form>');document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var d=Object.fromEntries(new FormData(ev.target)),a=S.actions.find(function(x){return x.id===aid});S.verifications.push({id:id("v"),actionId:aid,result:d.result,note:d.note,at:now()});a.status=d.result==="effective"?"closed":"reopened";var f=S.findings.find(function(x){return x.id===a.findingId}),all=S.actions.filter(function(x){return x.findingId===a.findingId});if(f&&all.length&&all.every(function(x){return x.status==="closed"}))f.status="closed";save();document.getElementById("mb").remove();render()}}
function bind(){document.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){view=b.dataset.nav;render()}});document.querySelectorAll("[data-act]").forEach(function(b){b.onclick=function(){var a=b.dataset.act;if(a==="qa")qa();if(a==="reset"&&confirm("Khôi phục dữ liệu minh họa ban đầu?")){S=seed();save();selectedAssessment=S.assessments[0].id;selectedRA=S.ra[0].id;render()}if(a==="close")document.getElementById("mb").remove();if(a==="newfw")newfw();if(a==="newas")newas();if(a==="upload")upload();if(a==="analyze")analyze();if(a==="finding")finding();if(a==="compliant"){var r=S.ra.find(function(x){return x.id===selectedRA});r.result="compliant";r.workflow="done";save();render()}}});document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){selectedAssessment=b.dataset.open;selectedRA=null;view="fieldwork";render()}});document.querySelectorAll("[data-ra]").forEach(function(b){b.onclick=function(){selectedRA=b.dataset.ra;render()}});document.querySelectorAll("[data-accept]").forEach(function(b){b.onclick=function(){var p=S.proposals.find(function(x){return x.id===b.dataset.accept}),r=S.ra.find(function(x){return x.id===p.raId});p.status="accepted";r.result=p.result;r.workflow="in_review";save();render()}});document.querySelectorAll("[data-reject]").forEach(function(b){b.onclick=function(){S.proposals.find(function(x){return x.id===b.dataset.reject}).status="rejected";save();render()}});document.querySelectorAll("[data-actionfor]").forEach(function(b){b.onclick=function(){action(b.dataset.actionfor)}});document.querySelectorAll("[data-verify]").forEach(function(b){b.onclick=function(){verify(b.dataset.verify)}});var s=document.getElementById("asSel");if(s)s.onchange=function(){selectedAssessment=s.value;selectedRA=null;render()}}
function render(){var f={dashboard:dashboard,frameworks:frameworks,assessments:assessments,fieldwork:fieldwork,findings:findings,actions:actions,reports:reports}[view]||dashboard;document.getElementById("root").innerHTML=f();bind()}
render();
})();
</script>
</body></html>
