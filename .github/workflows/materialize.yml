name: Materialize Production v1
on:
  push:
    branches: [production-v1]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify bundle parts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 6
          test "$(wc -c < bootstrap/part-01.txt)" -eq 6500
          test "$(wc -c < bootstrap/part-02.txt)" -eq 6500
          test "$(wc -c < bootstrap/part-03.txt)" -eq 6500
          test "$(wc -c < bootstrap/part-04.txt)" -eq 6500
          test "$(wc -c < bootstrap/part-05.txt)" -eq 6500
          test "$(wc -c < bootstrap/part-06.txt)" -eq 3012

      - name: Materialize production source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.txt | base64 -d > /tmp/compliance-prod-v1.tgz
          tar -xzf /tmp/compliance-prod-v1.tgz
          rm -f index.html
          rm -rf bootstrap
          # GitHub App token cannot modify workflow files. Keep the workflow files
          # exactly as they exist on the remote branch; they will be upgraded separately.
          git checkout -- .github/workflows/qa.yml .github/workflows/materialize.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production QA before commit
        run: npm run qa

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "release: materialize Compliance Production v1 candidate"
          git push origin HEAD:production-v1
