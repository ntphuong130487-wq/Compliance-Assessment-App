name: Compliance MVP QA
on:
  push:
    branches: [main, feature/product-v1-ui-ai]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static QA
        run: node tests/qa.mjs
      - name: Run obligation extraction QA
        run: node tests/obligation-extractor.mjs
      - name: Run RBAC policy QA
        run: node tests/access-control.mjs
      - name: Run Auth foundation QA
        run: node tests/auth-foundation.mjs
      - name: Run Database schema QA
        run: node tests/db-schema.mjs
      - name: Run Production Core QA
        run: node tests/production-core.mjs
      - name: Run evidence security QA
        run: node tests/evidence-security.mjs
      - name: Run Product v1 business regression
        run: node tests/product-v1-regression.mjs
      - name: Run OCR and AI foundation QA
        run: node tests/intelligence-foundation.mjs
      - name: Run product view-model behavior QA
        run: node tests/view-models.mjs
      - name: Run modular screen QA
        run: node tests/screen-modules.mjs
      - name: Run real PDF DOCX scan OCR regression
        run: node tests/ocr-fixtures.mjs
      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - name: Run browser-level product regression
        run: |
          node tests/browser-server.mjs > /tmp/compliance-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Check application syntax
        run: |
          node --check access-control.js
          node --check src/app.js
          node --check api/state.js
          node --check api/system.js
          node --check api/auth.js
          node --check api/users.js
          node --check lib/system-routes.js
          node --check lib/auth-routes.js
          node --check lib/user-routes.js
          node --check api/evidence.js
          node --check lib/obligation-extractor.js
          node --check lib/document-intelligence.js
          node --check lib/ai-obligation-extractor.js
          node --check src/ui/product-ui.js
          node --check src/ui/view-models.js
          node --check src/screens/shared.js
          node --check src/screens/dashboard.js
          node --check src/screens/frameworks.js
          node --check src/screens/assessments.js
          node --check src/screens/fieldwork.js
          node --check src/screens/findings.js
          node --check src/screens/actions.js
          node --check src/screens/reports.js
          node --check src/screens/settings.js
          node --check src/workflows/action-governance.js
          node --check src/workflows/assessment-assignment.js
          node --check api/obligations/extract.js
          node --check api/source/extract.js
          node --check api/regulations/search.js
          node --check lib/clerk-auth.js
          node --check api/notifications/run.js
          node --check lib/db.js
          node --check lib/server-authz.js
          node --check api/v1/bootstrap.js
          node --check api/v1/commands.js
          node --check scripts/db-check.mjs
          node --check scripts/db-migrate.mjs
          node --check tests/browser-server.mjs
          node --check tests/browser-product.mjs
          node --check tests/evidence-security.mjs

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compliance_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compliance_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: compliance_migration_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Fetch main baseline schema
        run: git fetch origin main:refs/remotes/origin/main --depth=1
      - name: Load pre-feature baseline schema
        run: git show origin/main:db/schema.sql | psql -v ON_ERROR_STOP=1
      - name: Dry-run AI migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/005_ai_obligation_intelligence.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/006_ai_review_audit.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/007_finding_remediation_model.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/008_action_change_governance.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/009_requirement_assessor_assignment.sql
      - name: Verify migration idempotence
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/005_ai_obligation_intelligence.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/006_ai_review_audit.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/007_finding_remediation_model.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/008_action_change_governance.sql
      - name: Verify migrated objects
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name='draft_requirements' AND column_name='ai_confidence'
            ) THEN RAISE EXCEPTION 'ai_confidence missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name='decision_logs' AND column_name='metadata'
            ) THEN RAISE EXCEPTION 'decision_logs.metadata missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname='chk_draft_requirements_ai_confidence'
            ) THEN RAISE EXCEPTION 'AI confidence constraint missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes WHERE indexname='idx_decision_draft_review'
            ) THEN RAISE EXCEPTION 'draft review audit index missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name='findings' AND column_name='remediation_required'
            ) THEN RAISE EXCEPTION 'findings.remediation_required missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name='remediation_actions' AND column_name='action_type'
            ) THEN RAISE EXCEPTION 'remediation_actions.action_type missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname='chk_remediation_action_type'
            ) THEN RAISE EXCEPTION 'remediation action type constraint missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_name='remediation_action_change_requests'
            ) THEN RAISE EXCEPTION 'remediation_action_change_requests missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes WHERE indexname='ux_action_pending_due_change'
            ) THEN RAISE EXCEPTION 'pending due-date request unique index missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_name='requirement_assessment_assignments'
            ) THEN RAISE EXCEPTION 'requirement_assessment_assignments missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes WHERE indexname='ux_ra_primary_assessor'
            ) THEN RAISE EXCEPTION 'primary assessor unique index missing'; END IF;
          END $$;
          SQL


  vercel-preview-smoke:
    runs-on: ubuntu-latest
    needs: [qa, migration-dry-run]
    if: github.ref == 'refs/heads/feature/product-v1-ui-ai' || github.event_name == 'pull_request'
    steps:
      - name: Wait for Vercel preview readiness
        env:
          PREVIEW_URL: https://compliance-assessment-app-git-feature-pro-654f8b-ntphuong130487.vercel.app
        run: |
          set -euo pipefail
          echo "Waiting for Vercel preview: $PREVIEW_URL"
          for i in $(seq 1 18); do
            CODE=$(curl -L -sS -o /tmp/readiness.json -w "%{http_code}" "$PREVIEW_URL/api/system?route=readiness" || true)
            if [ "$CODE" = "200" ]; then
              cat /tmp/readiness.json
              node -e '
                const fs=require("fs");
                const x=JSON.parse(fs.readFileSync("/tmp/readiness.json","utf8"));
                if(!x.ok) throw new Error("readiness ok=false");
                if(!x.productionReady) {
                  console.error(JSON.stringify({productionReady:x.productionReady,missing:x.missing,database:x.database,storage:x.storage,auth:x.auth},null,2));
                  process.exit(2);
                }
                console.log("Vercel preview readiness PASS");
              '
              exit 0
            fi
            if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "Vercel preview is protected (HTTP $CODE); smoke test requires deployment bypass/access token."
              cat /tmp/readiness.json || true
              exit 3
            fi
            echo "Attempt $i/18: HTTP $CODE; retrying in 10s"
            sleep 10
          done
          echo "Timed out waiting for Vercel preview readiness."
          cat /tmp/readiness.json || true
          exit 4
