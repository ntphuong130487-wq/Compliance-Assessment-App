name: Compliance MVP QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static QA
        run: node tests/qa.mjs
      - name: Run obligation extraction QA
        run: node tests/obligation-extractor.mjs
      - name: Run RBAC policy QA
        run: node tests/access-control.mjs
      - name: Run Auth foundation QA
        run: node tests/auth-foundation.mjs
      - name: Run Database schema QA
        run: node tests/db-schema.mjs
      - name: Run Production Core QA
        run: node tests/production-core.mjs
      - name: Check application syntax
        run: |
          node --check access-control.js
          node --check src/app.js
          node --check api/state.js
          node --check api/system.js
          node --check api/auth.js
          node --check api/users.js
          node --check api/clerk-proxy.js
          node --check lib/system-routes.js
          node --check lib/auth-routes.js
          node --check lib/user-routes.js
          node --check api/evidence.js
          node --check lib/obligation-extractor.js
          node --check api/obligations/extract.js
          node --check api/source/extract.js
          node --check api/regulations/search.js
          node --check lib/clerk-auth.js
          node --check api/notifications/run.js
          node --check lib/db.js
          node --check lib/server-authz.js
          node --check api/v1/bootstrap.js
          node --check api/v1/commands.js
          node --check scripts/db-check.mjs
          node --check scripts/db-migrate.mjs


  production-clerk-proxy-smoke:
    runs-on: ubuntu-latest
    needs: [qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify production Clerk proxy path
        env:
          PRODUCTION_URL: https://compliance-assessment-app-ashen.vercel.app
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/clerk-js.txt -w "%{http_code}"               "$PRODUCTION_URL/__clerk/npm/@clerk/clerk-js@6/dist/clerk.browser.js" || true)
            echo "Attempt $i/24: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              BYTES=$(wc -c < /tmp/clerk-js.txt)
              echo "Clerk proxy bundle reachable: $BYTES bytes"
              if [ "$BYTES" -lt 1000 ]; then
                echo "Unexpectedly small Clerk JS bundle"
                cat /tmp/clerk-js.txt || true
                exit 21
              fi
              exit 0
            fi
            if [ "$CODE" = "400" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ] || [ "$CODE" = "422" ] || [ "$CODE" = "502" ] || [ "$CODE" = "503" ]; then
              echo "Clerk proxy returned application/upstream error:"
              cat /tmp/clerk-js.txt || true
              exit 22
            fi
            sleep 5
          done
          echo "Timed out waiting for Clerk proxy bundle"
          cat /tmp/clerk-js.txt || true
          exit 23
