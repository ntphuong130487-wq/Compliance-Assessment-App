name: Compliance MVP QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static QA
        run: node tests/qa.mjs
      - name: Run obligation extraction QA
        run: node tests/obligation-extractor.mjs
      - name: Run RBAC policy QA
        run: node tests/access-control.mjs
      - name: Run Auth foundation QA
        run: node tests/auth-foundation.mjs
      - name: Run Database schema QA
        run: node tests/db-schema.mjs
      - name: Run Production Core QA
        run: node tests/production-core.mjs
      - name: Check application syntax
        run: |
          node --check access-control.js
          node --check src/app.js
          node --check api/state.js
          node --check api/system.js
          node --check api/auth.js
          node --check api/users.js
          node --check api/clerk-proxy.js
          node --check lib/system-routes.js
          node --check lib/auth-routes.js
          node --check lib/user-routes.js
          node --check api/evidence.js
          node --check lib/obligation-extractor.js
          node --check api/obligations/extract.js
          node --check api/source/extract.js
          node --check api/regulations/search.js
          node --check lib/clerk-auth.js
          node --check api/notifications/run.js
          node --check lib/db.js
          node --check lib/server-authz.js
          node --check api/v1/bootstrap.js
          node --check api/v1/commands.js
          node --check scripts/db-check.mjs
          node --check scripts/db-migrate.mjs


  production-clerk-proxy-smoke:
    runs-on: ubuntu-latest
    needs: [qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify production Clerk proxy path
        env:
          PRODUCTION_URL: https://compliance-assessment-app-ntphuong130487.vercel.app
        run: |
          set -euo pipefail
          for i in $(seq 1 3); do
            CODE=$(curl -L --max-redirs 5 --max-time 12 -sS -o /tmp/clerk-js.txt -w "%{http_code}" "$PRODUCTION_URL/__clerk/npm/@clerk/clerk-js@6/dist/clerk.browser.js" || true)
            echo "Attempt $i/3: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              BYTES=$(wc -c < /tmp/clerk-js.txt)
              echo "Clerk proxy bundle reachable: $BYTES bytes"
              if [ "$BYTES" -lt 1000 ]; then
                echo "Unexpectedly small Clerk JS bundle"
                cat /tmp/clerk-js.txt || true
                exit 21
              fi
              exit 0
            fi
            if [ "$CODE" = "400" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ] || [ "$CODE" = "422" ] || [ "$CODE" = "502" ] || [ "$CODE" = "503" ]; then
              echo "Clerk proxy returned application/upstream error:"
              cat /tmp/clerk-js.txt || true
              exit 22
            fi
            sleep 5
          done
          echo "Timed out waiting for Clerk proxy bundle"
          cat /tmp/clerk-js.txt || true
          exit 23


  production-clerk-ui-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [production-clerk-proxy-smoke]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Clerk sign-in UI opens in production
        env:
          PRODUCTION_URL: https://compliance-assessment-app-ntphuong130487.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on("console",m=>{ if(m.type()==="error") errors.push(m.text()); });
          await page.goto(process.env.PRODUCTION_URL,{waitUntil:"networkidle",timeout:60000});
          const body=await page.locator("body").innerText();
          if(body.includes("SCRIPT_LOAD_FAILED")||body.includes("CLERK_JS_LOAD_FAILED")){
            throw new Error("Clerk client still reports script load failure");
          }
          const login=page.getByRole("button",{name:/Đăng nhập bằng email/i});
          await login.waitFor({state:"visible",timeout:20000});
          await login.click();
          await page.waitForTimeout(2500);
          const visibleText=(await page.locator("body").innerText()).toLowerCase();
          if(!/(sign in|đăng nhập|email address|continue)/i.test(visibleText)){
            throw new Error("Clerk sign-in UI did not open");
          }
          if(errors.some(x=>/clerk.*load|script_load_failed|clerk_js_load_failed/i.test(x))){
            throw new Error("Browser console contains Clerk loading error: "+errors.join(" | "));
          }
          console.log("Production Clerk UI smoke PASS");
          await browser.close();
          NODE


  production-private-blob-smoke:
    runs-on: ubuntu-latest
    needs: [production-clerk-proxy-smoke]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run one-time authenticated production private Blob smoke
        env:
          PRODUCTION_URL: https://compliance-assessment-app-ntphuong130487.vercel.app
          SMOKE_REQUEST_ID: 8f7e9016-9e69-4e6f-bbb8-f0b02d4f8101
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -L --max-time 30 -sS -o /tmp/private-blob-smoke.html -w "%{http_code}"               "$PRODUCTION_URL/smoke/private-blob?requestId=$SMOKE_REQUEST_ID" || true)
            echo "Attempt $i/30: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              if grep -q "<h1>PASS</h1>" /tmp/private-blob-smoke.html; then
                echo "Production private Blob smoke PASS"
                cat /tmp/private-blob-smoke.html
                exit 0
              fi
              echo "Smoke endpoint returned 200 without PASS"
              cat /tmp/private-blob-smoke.html
              exit 41
            fi
            if [ "$CODE" = "404" ]; then
              sleep 5
              continue
            fi
            echo "Smoke endpoint failed:"
            cat /tmp/private-blob-smoke.html || true
            exit 42
          done
          echo "Timed out waiting for deployed smoke endpoint"
          exit 43
